<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>Claude Remote</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Connection Screen -->
        <div id="connect-screen" class="screen">
            <h1>Claude Remote</h1>
            <p class="subtitle">Voice control for Claude Code</p>

            <div id="connection-form">
                <label for="ws-url">WebSocket URL</label>
                <input type="text" id="ws-url" placeholder="ws://192.168.1.x:8765/?token=...">
                <button id="connect-btn" class="btn primary">Connect</button>
            </div>

            <p class="hint">Scan the QR code on your Mac to auto-fill</p>
        </div>

        <!-- Main Control Screen -->
        <div id="main-screen" class="screen hidden">
            <div id="status-bar">
                <span id="status-indicator" class="disconnected"></span>
                <span id="status-text">Disconnected</span>
            </div>

            <div id="transcript">
                <p id="transcript-text"></p>
            </div>

            <div id="controls">
                <button id="ptt-btn" class="ptt-btn">
                    <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1 1.93c-3.94-.49-7-3.85-7-7.93h2c0 3.31 2.69 6 6 6s6-2.69 6-6h2c0 4.08-3.06 7.44-7 7.93V20h4v2H8v-2h4v-4.07z"/>
                    </svg>
                    <span class="ptt-label">Hold to Talk</span>
                </button>

                <button id="enter-btn" class="enter-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 7v4H5.83l3.58-3.59L8 6l-6 6 6 6 1.41-1.41L5.83 13H21V7h-2z"/>
                    </svg>
                    <span>Enter</span>
                </button>
            </div>

            <button id="disconnect-btn" class="btn secondary">Disconnect</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
